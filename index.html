<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for proper scaling and character encoding -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section of the webpage -->
    <header>
        <h1>Welcome to My Website!</h1>
        <p>Built with HTML, CSS, and JavaScript, and hosted on GitHub Pages.</p>
    </header>

    <!-- Main content container -->
    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>Hi there! I am learning how to code and create my own corner of the internet.</p>
            <!-- Interactive Button -->
            <button id="colorBtn">Click Me!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Future Developer. All rights reserved.</p>
    </footer>

    <!-- Link to our external JavaScript file (loaded at the end of the body) -->
    <script src="script.js"></script>
</body>
</html>
